name: Gemini Quiz Issue Creator

on:
  push:
    paths:
      - 'challengeLog.md' # challengeLog.md가 푸시될 때만 자동 작동

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Generate Issue via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os
          from google import genai

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          with open('challengeLog.md', 'r', encoding='utf-8') as f:
              content = f.read()

          prompt = f'다음 문서에서 가장 최근에 추가된 퀴즈만 추출해서 GitHub 이슈 제목과 본문으로 만들어줘. Output format: TITLE:::BODY\n\n{content}'
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt
          )
          
          text = response.text
          parts = text.split(':::', 1)
          title = parts[0].strip() if len(parts) > 0 else '[Challenge] 복습 퀴즈'
          body = parts[1].strip() if len(parts) > 1 else text

          with open('title.txt', 'w', encoding='utf-8') as f: f.write(title)
          with open('body.txt', 'w', encoding='utf-8') as f: f.write(body)
          "

          TITLE=$(cat title.txt)
          gh issue create --title "$TITLE" --body-file body.txt